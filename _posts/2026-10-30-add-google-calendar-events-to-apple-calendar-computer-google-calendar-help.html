 <figure> <blockquote> <h2>Change which [Google] calendars get synced</h2>

<h4><strong>Which calendars are automatically synced</strong></h4>

<ul>
  <li>Any calendars that you find under "My Calendars" in Google Calendar on your computer</li>
  <li>Birthdays</li>
</ul>

<h4><strong>Sync other calendars</strong></h4>

<ol>
  <li>On your computer, visit the <a href="https://www.google.com/calendar/syncselect">Calendar sync</a> page.</li>
  <li>Check or uncheck the names of any calendars.</li>
  <li>In the bottom right corner, click <strong>Save</strong>.</li>
  <li>When you're done, refresh your calendar.</li>
</ol>
