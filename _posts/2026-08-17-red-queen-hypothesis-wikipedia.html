 <figure> <blockquote> The <b>Red Queen hypothesis</b> is a <a href="https://en.wikipedia.org/wiki/Hypothesis">hypothesis</a> in <a href="https://en.wikipedia.org/wiki/Evolutionary_biology">evolutionary biology</a> proposed in 1973, that species must constantly <a href="https://en.wikipedia.org/wiki/Adaptation">adapt</a>, <a href="https://en.wikipedia.org/wiki/Evolution">evolve</a>, and proliferate in order to survive while pitted against ever-evolving opposing species. </blockquote> <figcaption> <cite>en.wikipedia.org</cite>, in "<cite><a href="https://en.wikipedia.org/wiki/Red_Queen_hypothesis">Red Queen hypothesis - Wikipedia</a></cite>" </figcaption> </figure>
